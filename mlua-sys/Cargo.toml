[package]
name = "mlua-sys"
version = "0.9.0"
authors = ["Aleksandr Orlenko <zxteam@pm.me>"]
rust-version = "1.71"
edition = "2021"
repository = "https://github.com/mlua-rs/mlua"
documentation = "https://docs.rs/mlua-sys"
readme = "README.md"
categories = ["external-ffi-bindings"]
license = "MIT"
links = "lua"
build = "build/main.rs"
description = """
Low level (FFI) bindings to Lua 5.4/5.3/5.2/5.1 (including LuaJIT) and Luau
"""

[package.metadata.docs.rs]
features = ["luau", "vendored"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
luau = ["luau0-src"]
luau-codegen = ["luau"]
luau-vector4 = ["luau"]
external = []
module = []

[dependencies]

[build-dependencies]
cc = "1.0"
cfg-if = "1.0"
pkg-config = "0.3.17"
luau0-src = { git = "https://github.com/mluau/luau-src-rs", optional = true }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(raw_dylib)'] }
