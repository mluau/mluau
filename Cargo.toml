[package]
name = "mluau"
version = "0.11.5" # remember to update mlua_derive
authors = ["cheesycod", "Dev Chrysalis Dalal <dev@deviaze.com>","Aleksandr Orlenko <zxteam@pm.me>", "kyren <catherine@kyju.org>"]
rust-version = "1.79.0"
edition = "2021"
repository = "https://github.com/mluau/mluau"
documentation = "https://docs.rs/mlua"
readme = "README.md"
keywords = ["luau", "scripting"]
categories = ["api-bindings"]
license = "MIT"
description = """
High level bindings to Luau.
"""

[package.metadata.docs.rs]
features = ["luau", "vendored", "send", "serde", "macros"]
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = ["mlua_derive", "mlua-sys"]

[features]
default = ["luau", "dynamic-userdata", "bytes", "none-primitive", "serde"]
luau = ["ffi/luau"]
luau-jit = ["luau", "ffi/luau-codegen"]
luau-vector4 = ["luau", "ffi/luau-vector4"]
# Luau's user-defined classes support is experimental upstream (gated behind
# fastflags prefixed `Debug*`) and its shape may still change, so this is opt-in.
luau-classes = ["luau", "ffi/luau-classes"]
# Custom `none` primitive in mluau/luau
none-primitive = ["luau", "ffi/none-primitive"]

send = []
serde = ["dep:serde", "bstr/serde", "none-primitive"]
macros = ["mlua_derive/macros"]
userdata-wrappers = ["parking_lot/send_guard"]
dynamic-userdata = ["luau"]

bytes = ["dep:bytes"]

# deprecated features
serialize = ["serde"]
vendored = []

[dependencies]
mlua_derive = { version = "=0.11.0", optional = true, path = "mlua_derive" }
bstr = { version = "1.0", features = ["std"], default-features = false }
either = "1.0"
num-traits = { version = "0.2.14" }
rustc-hash = "2.0"
serde = { version = "1.0", optional = true }
parking_lot = { version = "0.12", features = ["arc_lock"] }
libc = "0.2"

ffi = { package = "mlua-sys", version = "0.9.0", path = "mlua-sys" }
bytes = { version = "1.0", optional = true }

[dev-dependencies]
trybuild = "1.0"
tokio = { version = "1.0", features = ["macros", "rt", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
maplit = "1.0"
static_assertions = "1.0"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
hyper = { version = "1.2", features = ["full"] }
hyper-util = { version = "0.1.3", features = ["full"] }
http-body-util = "0.1.1"
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
criterion = { version = "0.7", features = ["async_tokio"] }
rustyline = "17.0"
tokio = { version = "1.0", features = ["full"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(tarpaulin_include)'] }

[[bench]]
name = "benchmark"
harness = false
required-features = []

[[bench]]
name = "serde"
harness = false
required-features = ["serde"]

[[example]]
name = "guided_tour"
required-features = ["macros"]

[[example]]
name = "serde"
required-features = ["serde"]

[[example]]
name = "userdata"
required-features = ["macros"]
